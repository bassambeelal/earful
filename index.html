<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Earful — free text-to-speech reader</title>
    <meta name="description" content="Listen to any PDF, book, article or photo of text. Natural voices, sentence and word highlighting, up to 4× speed. Free, open source, private and offline." />
    <meta name="theme-color" content="#5b4fd6" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Earful" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Earful" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Earful" />
    <meta property="og:title" content="Earful — free text-to-speech reader" />
    <meta property="og:description" content="Listen to any PDF, book, article or photo of text with natural voices. Free, open source, private and offline." />
    <meta property="og:url" content="https://bassambeelal.github.io/earful/" />
    <meta property="og:image" content="https://bassambeelal.github.io/earful/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Earful: listen to anything you read" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      /* Paint the right background before the app loads (no white flash in dark mode). */
      html { background: #fbfaf8; color: #1d1b22; }
      @media (prefers-color-scheme: dark) { html:not([data-theme]) { background: #121117; color: #ecebf1; } }
      html[data-theme] { background: var(--bg); color: var(--text); }
      .noscript { max-width: 32rem; margin: 20vh auto 0; padding: 0 24px; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
      .noscript strong { display: block; font-size: 20px; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="noscript">
        <strong>Earful needs JavaScript</strong>
        Please turn on JavaScript in your browser to import documents and have them read aloud. Everything runs on your device.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
